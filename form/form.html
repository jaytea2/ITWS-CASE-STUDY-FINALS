<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formstyle.css">
    <link rel="icon" type="image/png" href="/image/okub.png">
    <title>Job Application</title>
    
</head>
<body>




    <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER-->
    
    <header class="header">

     <img src="image/okub.png" alt="Company Logo" class="logo-image">
        <span class="logo-text">Allen's Buko Juice Company</span>

        <div class="top-right">
            <h1>Fresh Buko Since (1980)</h1>
            <div class="top-right-info">
                <span>Nueva Ecija · Cabanatuan City</span>
                
            </div>
        </div>

    </header>

    <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER--> <!--HEADER-->




    <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM-->

    <section class="wrapper">
        <form id="jobForm" class="form-box">

            <h2>Job Application</h2>


            <div class="grid-2">

                <div class="field">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="field">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>

            </div>



            <div class="grid-2">

                <div class="field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
            </div>

            <div class="grid-2">

                <div class="field">
                    <label for="phone">Phone *</label>
                    <input type="tel" id="phone" pattern="[0-9]{11}" placeholder="e.g. 09123456789" required>
                </div>

            </div>



            <div class="field">

                <label for="position">Position*</label>
                <input type="text" id="position" placeholder="Job title you are applying for" required>


            </div>



            <div class="field">

                <label for="resume">Upload CV / Resume *</label>
                <input type="file" id="resume" accept=".pdf, .doc, .docx" required>

            </div>



            <div class="grid-2">

                <div class="field">
                    <label for="linkedin">LinkedIn URL</label>
                    <input type="text" id="linkedin">
                </div>

                <div class="field">
                    <label for="website">Other Website</label>
                    <input type="text" id="website">
                </div>

            </div>



            <div class="field">

                <label for="comments">Additional Comments</label>
                <textarea id="comments" placeholder="Add anything else you want to share."></textarea>

            </div>
            
            

            <label>
                <input type="checkbox" id="agree" required>I agree to the privacy policy.
            </label><br>

            
            <button type="submit" class="apply-btn">SUBMIT</button>

            
            <p id="kopal" class="confirmation"></p>
        </form>
    </section>

    <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM--> <!--FORM-->



    <script src="formscript.js"></script>
</body>

</html>
